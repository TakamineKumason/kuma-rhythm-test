<canvas id="cv"></canvas>
<div id="title" class="panel show">
  <h1 class="ttl"><img class="px bear" src="img/bear3.png" alt="">クマリズム<span style="font-size:14px;color:#ff7a7a">テスト</span><img class="px bear" src="img/bear9.png" alt=""></h1>

  </div>
  <button id="btnHowto">操作説明</button>
  <div class="first"><div class="plbl">はじめて遊ぶときは<br>まず「合わせる」でずれを合わせてね</div>
  <div class="offset">ずれ補正 <button id="offMinus">-</button><span id="offVal">0 ミリ秒</span><button id="offPlus">+</button><button id="btnCalib">合わせる</button></div>
  </div>
  <div class="vol" data-vol></div>
  <div id="hellRow"><button id="btnHell">ヘルモード OFF</button><div class="plbl" id="hellHelp">ON にすると3列。← ↓ → か A S D／スマホは列をタップ</div></div>
  <button id="hellTest" style="display:none">テスト用：記録を最初の状態に戻す</button>
  <div class="songs"><div class="plbl">曲をえらんで遊ぶ</div><div id="songBtns"></div></div>
  <p class="credit">声：VOICEVOX:ずんだもん<br>絵：高峰クマスン メンバーシップ絵文字</p>
</div>
<div id="howtoBox"><div class="card">
  <p class="howto">スタンプが線に重なったらタップ！<br><span style="font-size:12px;font-weight:400;opacity:.8">PC はどのキーでもOK（Esc で一時停止）</span><br><span style="font-size:12px;font-weight:400;color:#ff9a9a">Bluetooth イヤホンでは遊べません（声が遅れて聞こえる）<br>スピーカーか有線イヤホンで遊んでね</span></p>
  <button id="btnHowtoOk">OK</button>
</div></div>
<button id="btnPause" aria-label="一時停止">II</button>

        const gr2 = g.createLinearGradient(0, pf.y, 0, judgeY);

      g.fillText(w.label, cx + size / 2 + 8 * U * p0.s, p0.y);
      g.globalAlpha = 1;
    }

  shownScore = shownScore < score ? Math.min(score, shownScore + Math.max(2, Math.ceil((score - shownScore) / 6))) : score;
  const rate = scoreRate(shownScore), tier = tierOf(rate);
  if (tier !== tierShown) { tierShown = tier; tierAt = sec; }

  const gx = bx + BS + 6 * U, gy = by + BS * 0.3, gh = BS * 0.4, gw = Math.max(40, W - gx - 64);
  g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(gx, gy, gw, gh);
  const gg = g.createLinearGradient(gx, 0, gx + gw, 0);
  gg.addColorStop(0, '#9fe8d8'); gg.addColorStop(0.5, '#ffd76a'); gg.addColorStop(1, '#ff7aa8');

  g.fillStyle = 'rgba(255,122,122,.9)'; g.fillRect(gx + gw * FAIL_RATE - 1, gy - 3 * U, 2, gh + 6 * U);
  g.fillStyle = '#1b1430'; g.font = '800 ' + Math.round(gh * 0.78) + 'px "M PLUS Rounded 1c", sans-serif';
  g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillText(Math.floor(rate * 100) + '%', gx + 6 * U, gy + gh / 2 + 1);
  const pop = sec - tierAt < 0.35 ? 1 + 0.5 * Math.sin(Math.PI * (sec - tierAt) / 0.35) : 1;
  const bim = bearImgs[tierShown];
  if (bim.complete) { g.imageSmoothingEnabled = false; g.drawImage(bim, bx + BS / 2 - BS * pop / 2, by + BS / 2 - BS * pop / 2, BS * pop, BS * pop); }
  g.fillStyle = '#f3ecff'; g.textBaseline = 'top'; g.textAlign = 'right';
  g.font = '800 ' + Math.round(16 * U) + 'px "M PLUS Rounded 1c", sans-serif';
  g.fillText(combo > 1 ? combo + ' コンボ' : '', W - 14 * U, by + BS + 4 * U);
  if (beatNow >= 0 && beatNow < COUNT_IN * BAR) {
    g.fillStyle = '#ffd76a'; g.font = '800 ' + Math.round(72 * U) + 'px "M PLUS Rounded 1c", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(COUNT_IN * BAR - Math.floor(beatNow)), cx, H * 0.4);
  }
  drawBursts(sec, cx, judgeY);
  drawShards(sec, cx, judgeY);
  if (flash && sec - flash.at < 0.45) {
    const k = (sec - flash.at) / 0.45;
    g.globalAlpha = 1 - k; g.fillStyle = flash.color;
    g.font = '800 ' + Math.round(28 * U) + 'px "M PLUS Rounded 1c", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(flash.text, cx, judgeY - ST * 0.75 - k * 10 * U);
    g.globalAlpha = 1;
  }
  const cur = chart.find(n => !n.judge) || chart[chart.length - 1];
  const line = chart.filter(n => n.bar === cur.bar);
  g.font = '800 ' + Math.round(15 * U) + 'px "M PLUS Rounded 1c", sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'left';
  const parts = line.map(n => WORDS[n.key].label);
  const total = g.measureText(parts.join(' ')).width;

    g.fillStyle = n.judge === 'perfect' || n.judge === 'good' ? '#ffd76a' : n.judge === 'miss' ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.75)';
    g.fillText(parts[i], x, H - 48 * U);
    x += g.measureText(parts[i] + ' ').width;
  });
}
function loop() {
  const sec = playing ? nowSec() : (FREEZE !== null ? FREEZE : -1);
  if (playing && !paused) {
    if (AUTO) {
      for (const n of chart) {
        if (n.judge) continue;
        if (n.sec > sec) break;
        judgeTap(n.sec, n.lane); playVoice(n.key);
      }
    }
    sweepMisses(sec);

cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(isHell() ? laneAt(e.clientX) : undefined); });
window.addEventListener('keydown', e => {
  if (e.repeat || !playing) return;
  e.preventDefault();
  if (e.key === 'Escape') { paused ? resumeGame() : pauseGame(); return; }
  onTap(LANE_KEYS[e.key]);
});
function setHell(on) {
  hell = on && hellUnlocked();
  try { localStorage.setItem('kuma_hell', hell ? '1' : '0'); } catch (e) {}
  const b = document.getElementById('btnHell');
  b.textContent = 'ヘルモード ' + (hell ? 'ON' : 'OFF'); b.classList.toggle('on', hell);
  document.getElementById('hellRow').classList.toggle('show', hellUnlocked());
  document.getElementById('title').classList.toggle('hell', hell);
  SONGS.forEach(s => showBest(s.id));
}
function refreshHell() { setHell(hell); }
document.getElementById('btnHell').addEventListener('click', () => setHell(!hell));
if (HELL_TEST) {
  document.getElementById('hellTest').style.display = '';
  document.getElementById('hellTest').addEventListener('click', () => {
    if (!confirm('記録を最初の状態（メンシのうた（ショート）以外エンジェルスン）に戻しますか？')) return;
    bests = testStartBests(); storeBests(); setHell(false);
  });
}
document.getElementById('btnPause').addEventListener('click', pauseGame);
document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnRestart').addEventListener('click', () => { paused = false; ac.resume(); start(); });
document.getElementById('btnQuit').addEventListener('click', quitGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function showOffset() { document.getElementById('offVal').textContent = (offsetMs > 0 ? '+' : '') + offsetMs + ' ミリ秒'; }
function bumpOffset(d) {
  offsetMs = Math.max(-300, Math.min(300, offsetMs + d));
  try { localStorage.setItem('menshi_offset2', String(offsetMs)); } catch (e) {}
  showOffset();
}
document.getElementById('offMinus').addEventListener('click', () => bumpOffset(-10));
document.getElementById('offPlus').addEventListener('click', () => bumpOffset(10));
let bests = {};
try {
  const raw = localStorage.getItem(bestStoreKey());
  const v = raw === null && HELL_TEST ? testStartBests() : JSON.parse(raw || '{}');
  for (const k in v) if (v[k] >= 0 && v[k] <= 1) bests[k] = v[k];
} catch (e) {}
function storeBests() { try { localStorage.setItem(bestStoreKey(), JSON.stringify(bests)); } catch (e) {} }
function saveBest(id, rate) {
  if (bests[id] !== undefined && rate <= bests[id]) return false;
  bests[id] = rate; storeBests(); showBest(id);
  return true;
}
function bestKey(id) { return hell ? id + ':hell' : id; }
function showBest(id) {
  id = id.replace(/:hell$/, '');
  const row = document.querySelector('#songBtns .srow[data-id="' + id + '"]');
  if (!row) return;
  const r = bests[bestKey(id)], ic = row.querySelector('.ic');
  ic.style.visibility = r === undefined ? 'hidden' : '';
  if (r !== undefined) ic.src = 'img/bear' + (tierOf(r) + 1) + '.png';
  row.querySelector('.best').textContent = r === undefined ? '' : Math.floor(r * 100) + '%';
  row.querySelector('.reset').style.visibility = r === undefined ? 'hidden' : '';
}
const LIST = SONGS;
for (const s of LIST) {

  const b = document.createElement('button'); b.className = 'play'; b.dataset.id = s.id;
  const ic = document.createElement('img'); ic.className = 'px ic'; ic.alt = '';

  const best = document.createElement('span'); best.className = 'best';
